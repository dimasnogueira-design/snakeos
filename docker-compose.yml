services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: snake_os
      POSTGRES_USER: snake_os
      POSTGRES_PASSWORD: change_me
    ports:
      - "5432:5432"
    volumes:
      - snake_os_pg:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snake_os -d snake_os"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  snake_os_pg:
